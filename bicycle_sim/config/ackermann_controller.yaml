controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    reference_timeout: 0.5
    front_steering: true
    open_loop: false
    velocity_rolling_window_size: 10
    position_feedback: false
    rear_wheels_names: [base_to_back_right_wheel, base_to_back_left_wheel]
    front_wheels_names: [base_to_front_right_hinge, base_to_front_left_hinge]
    wheelbase: 1.25
    front_wheel_track: 1.18
    rear_wheel_track: 1.18
    front_wheels_radius: 0.5
    rear_wheels_radius: 0.5
